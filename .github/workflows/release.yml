name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v1.0, v1.2.3
  workflow_dispatch: # Allow manual trigger from the GitHub Actions UI

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            archive_name: synapse-linux-x86_64.tar.gz
          - os: macos-latest
            archive_name: synapse-macos-universal.tar.gz
          - os: windows-latest
            archive_name: synapse-windows-x86_64.zip

    permissions:
      contents: write # Required for creating releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold ccache

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          
      - name: Install Python Dependencies
        run: uv sync --all-extras

      - name: Build Application
        shell: bash
        run: ./build.sh
        
      - name: Archive build (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist
          tar -czvf ${{ matrix.archive_name }} *
          
      - name: Archive build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd dist
          Compress-Archive -Path * -DestinationPath ${{ matrix.archive_name }}
          
      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: dist/${{ matrix.archive_name }}
          retention-days: 7
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/${{ matrix.archive_name }}
