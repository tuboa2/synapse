[project]
name = "synapse"
version = "0.1.0"
description = "Synapse: Cross-platform multi-process Python daemon for local process telemetry"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=0.10.0",
    "uvloop>=0.22.1",
    "psutil",
    "sqlglot>=30.12.0",
]

[project.optional-dependencies]
linux = [
    "uvloop>=0.19.0"
]
windows-macos = []
build = [
    "nuitka>=2.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daemon", "src/domain", "src/ipc", "src/telemetry", "src/cli"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "nuitka>=2.0.0",
    "hypothesis>=6.156.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "ARG"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
